---
name: SEO CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.1

      - name: Test links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: '--timeout 60 --suggest --max-redirects 20 -a 403,406,429,500,502,503,522,999 .'
          output: log.json
          format: json
          fail: false
          failIfEmpty: false
          checkbox: false
          # Keep the JSON output compatible with lychee-log-parser.
          lycheeVersion: v0.15.1

      - name: Checkout link log parser
        uses: actions/checkout@v4.1.1
        with:
          repository: 3mdeb/lychee-log-parser
          path: lychee-log-parser

      - name: Parse link checker log
        run: |
          lychee-log-parser/src/lychee_log_parser.py 404..407 409..417 421..428 431 451 -t -n || { cat github_job_summary.md > "${GITHUB_STEP_SUMMARY}"; exit 1; }

  seo_spy_orphan_pages:
    runs-on: ubuntu-latest
    name: Check orphan pages
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Checkout SEO Spy
        uses: actions/checkout@v3
        with:
          repository: 3mdeb/seo-spy
          path: seo-spy
      - uses: actions/setup-python@v3
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-spy/requirements.txt
          pip install -r requirements.txt
      - name: Serve site
        run: |
          mkdocs build
          python3 -m http.server --directory site &
          sed -i 's/https:\/\/docs.dasharo.com/http:\/\/0.0.0.0:8000/g' site/sitemap.xml
      - name: Check orphan pages
        uses: 3mdeb/seo-spy-action@main
        with:
          domain: 'http://0.0.0.0:8000'
          args: '-o --ignore-path resources/hcl/'
  seo_spy_canonical_links:
    runs-on: ubuntu-latest
    name: Check canonical links
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Checkout SEO Spy
        uses: actions/checkout@v3
        with:
          repository: 3mdeb/seo-spy
          path: seo-spy
      - uses: actions/setup-python@v3
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-spy/requirements.txt
          pip install -r requirements.txt
      - name: Serve site
        run: |
          mkdocs build
          python3 -m http.server --directory site &
          sed -i 's/https:\/\/docs.dasharo.com/http:\/\/0.0.0.0:8000/g' site/sitemap.xml
      - name: Check canonical links
        uses: 3mdeb/seo-spy-action@main
        with:
          domain: 'http://0.0.0.0:8000'
          args: '-c'
